[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dip-toolkit"
version = "0.1.0"
description = "Biblioteca didática de Processamento Digital de Imagens"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gdown>=6.0,<7",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<5",
    "pandas>=2.1,<3",
    "PyWavelets>=1.5,<2",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
    "seaborn>=0.13,<1",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
